<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuttoInsieme - Pannello Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #6a9c78;
    --crema: #fdf8f0;
    --terra: #b5651d;
    --testo: #3a3a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef3ea, #fdf8f0);
    font-family: 'Nunito', sans-serif;
    color: var(--testo);
    padding: 20px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    padding: 30px;
    max-width: 420px;
    margin: 60px auto;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 16px;
    border: 2px solid #e2e2e2;
    font-size: 1rem;
    margin-top: 10px;
    font-family: inherit;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 20px;
    background: var(--verde);
    color: white;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.05rem;
    cursor: pointer;
  }
  #errore {
    color: #c0392b;
    text-align: center;
    margin-top: 12px;
    font-weight: 600;
  }
  #pannello { display: none; max-width: 960px; margin: 0 auto; }
  .contenitore-tabella {
    background: #fff;
    border-radius: 16px;
    overflow-y: auto;
    max-height: 65vh;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
  }
  th {
    background: var(--verde);
    color: white;
    font-family: 'Baloo 2', sans-serif;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .attivo { color: var(--verde); font-weight: 700; }
  .disattivo { color: #999; }
  .contatore {
    text-align: center;
    margin-bottom: 16px;
    color: #777;
  }

  /* --- Modulo aggiungi socio --- */
  .box-aggiungi {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-aggiungi h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .riga-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .riga-form .campo {
    flex: 1;
    min-width: 140px;
  }
  .riga-form label {
    font-size: 0.8rem;
    color: #777;
    display: block;
    margin-bottom: 2px;
  }
  .riga-form input { margin-top: 0; }
  .riga-form button {
    width: auto;
    margin-top: 0;
    padding: 12px 20px;
    white-space: nowrap;
  }
  #msgAggiungi {
    margin-top: 10px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgAggiungi.ok { color: var(--verde); }
  #msgAggiungi.errore-msg { color: #c0392b; }

  /* --- Interruttore attivo/disattivo --- */
  .interruttore {
    width: 44px;
    height: 24px;
    border-radius: 12px;
    border: none;
    position: relative;
    cursor: pointer;
    padding: 0;
    background: #ccc;
    transition: background 0.15s;
  }
  .interruttore.on { background: var(--verde); }
  .interruttore .pallino {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.15s;
  }
  .interruttore.on .pallino { left: 22px; }

  /* --- Pulsante elimina --- */
  .btn-elimina {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    border-radius: 12px;
    background: #fff;
    color: #c0392b;
    border: 2px solid #f0d0cc;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-elimina:hover { background: #fdf1ef; }

  /* --- Pannello progetti/letterine --- */
  .box-progetti {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-progetti h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .riga-progetto {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .riga-progetto:last-of-type { border-bottom: none; }
  .riga-progetto .campo-lettera { width: 70px; }
  .riga-progetto .campo-nome { flex: 1; min-width: 130px; }
  .riga-progetto .campo-perc { width: 100px; }
  .riga-progetto .campo-didascalia { flex: 2; min-width: 220px; }
  .riga-progetto label {
    font-size: 0.75rem;
    color: #777;
    display: block;
    margin-bottom: 2px;
  }
  .riga-progetto input { margin-top: 0; padding: 8px 10px; }
  .riga-progetto button {
    width: auto;
    margin-top: 0;
    padding: 10px 16px;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .riga-nuovo-progetto {
    border-top: 2px dashed #ddd;
    margin-top: 6px;
    padding-top: 16px;
  }
  #msgProgetti {
    margin-top: 10px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgProgetti.ok { color: var(--verde); }
  #msgProgetti.errore-msg { color: #c0392b; }

  /* --- Importa Ordine --- */
  .box-importa {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-importa h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .griglia-importa {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  .griglia-importa .campo-largo { grid-column: 1 / -1; }
  .griglia-importa label {
    font-size: 0.8rem;
    color: #777;
    display: block;
    margin-bottom: 4px;
  }
  .griglia-importa input, .griglia-importa select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #e2e2e2;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .btn-importa-azione {
    width: auto;
    margin-top: 0;
    padding: 12px 22px;
    font-size: 0.95rem;
  }
  #msgImporta {
    margin-top: 12px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgImporta.ok { color: var(--verde); }
  #msgImporta.errore-msg { color: #c0392b; }

  .tabella-abbinamento {
    margin-top: 20px;
    border-top: 2px dashed #ddd;
    padding-top: 16px;
  }
  .riga-abbinamento {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  .riga-abbinamento .nome-scritto {
    flex: 1;
    min-width: 160px;
    font-weight: 600;
  }
  .riga-abbinamento .totale-scritto {
    width: 90px;
    color: #555;
  }
  .riga-abbinamento .stato-abbinamento {
    flex: 2;
    min-width: 220px;
  }
  .badge-riconosciuto {
    background: #e6f2ea;
    color: var(--verde);
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .badge-saltato {
    background: #f0f0f0;
    color: #888;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .badge-dedotto {
    background: #fdf1e0;
    color: var(--terra);
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 4px;
  }
  .link-correggi-dedotto {
    display: block;
    font-size: 0.78rem;
    color: #888;
    cursor: pointer;
    text-decoration: underline;
  }
  .riga-abbinamento select {
    padding: 6px 10px;
    border-radius: 10px;
    border: 2px solid #e2e2e2;
    font-family: inherit;
    max-width: 260px;
  }
  .riepilogo-import {
    background: var(--crema);
    border-radius: 12px;
    padding: 14px;
    margin-top: 16px;
    font-size: 0.9rem;
  }

  /* --- Foglio Cassa --- */
  .box-cassa {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-cassa h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .riga-scelta-socio {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .riga-scelta-socio .campo { flex: 1; min-width: 200px; }
  .riga-scelta-socio label {
    font-size: 0.8rem;
    color: #777;
    display: block;
    margin-bottom: 4px;
  }
  .riga-scelta-socio select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #e2e2e2;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .riga-scelta-socio button {
    width: auto;
    margin-top: 0;
    padding: 11px 20px;
  }

  #areaScontrino { display: none; }
  .intestazione-scontrino {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--verde);
    color: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 4px;
  }
  .intestazione-scontrino .nome-socio {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.1rem;
  }
  .intestazione-scontrino .saldo-attuale {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.3rem;
  }
  .fascia-lettere {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 0 16px;
  }
  .chip-lettera {
    background: var(--crema);
    border: 1px solid #e6ddc9;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 0.82rem;
    color: var(--testo);
  }
  .chip-lettera strong { color: var(--terra); }

  .contenitore-scontrino {
    max-height: 55vh;
    overflow-y: auto;
    border-radius: 12px;
    border: 1px solid #eee;
  }
  .riga-scontrino {
    display: grid;
    grid-template-columns: 90px 1fr 90px 90px;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.88rem;
    align-items: start;
  }
  .riga-scontrino.versamento { background: #f3f9f4; }
  .riga-scontrino .data-scontrino { color: #888; }
  .riga-scontrino .descrizione-scontrino .nota-maggiorazione {
    display: block;
    font-size: 0.78rem;
    color: #888;
    margin-top: 2px;
  }
  .riga-scontrino .importo-scontrino {
    text-align: right;
    font-weight: 600;
  }
  .riga-scontrino .importo-scontrino.negativo { color: #c0392b; }
  .riga-scontrino .importo-scontrino.positivo { color: var(--verde); }
  .riga-scontrino .saldo-scontrino {
    text-align: right;
    color: #555;
  }
  .intestazione-scontrino-colonne {
    display: grid;
    grid-template-columns: 90px 1fr 90px 90px;
    gap: 8px;
    padding: 8px 14px;
    font-size: 0.78rem;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .box-nuovo-versamento {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 2px dashed #ddd;
  }
  .riga-versamento-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .riga-versamento-form .campo { flex: 1; min-width: 130px; }
  .riga-versamento-form label {
    font-size: 0.8rem;
    color: #777;
    display: block;
    margin-bottom: 4px;
  }
  .riga-versamento-form input, .riga-versamento-form select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #e2e2e2;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .riga-versamento-form button {
    width: auto;
    margin-top: 0;
    padding: 11px 20px;
    white-space: nowrap;
  }
  #msgVersamento {
    margin-top: 10px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgVersamento.ok { color: var(--verde); }
  #msgVersamento.errore-msg { color: #c0392b; }
</style>
</head>
<body>

<div class="card" id="cardLogin">
  <h1>Pannello Admin</h1>
  <input type="password" id="password" placeholder="Password amministratore">
  <button onclick="loginAdmin()">Entra</button>
  <div id="errore"></div>
</div>

<div id="pannello">
  <h1>Elenco Soci</h1>

  <div class="box-aggiungi">
    <h2>Aggiungi socio</h2>
    <div class="riga-form">
      <div class="campo">
        <label for="nuovoNome">Nome e cognome</label>
        <input type="text" id="nuovoNome" placeholder="Mario Rossi">
      </div>
      <div class="campo">
        <label for="nuovoPin">PIN</label>
        <input type="text" id="nuovoPin" placeholder="4 cifre" maxlength="4">
      </div>
      <div class="campo">
        <label for="nuovaData">Socio dal</label>
        <input type="date" id="nuovaData">
      </div>
      <button onclick="aggiungiSocio()" style="max-width: 160px;">Aggiungi</button>
    </div>
    <div id="msgAggiungi"></div>
  </div>

  <div class="box-progetti">
    <h2>Progetti / Letterine</h2>
    <div id="elencoProgetti"></div>

    <div class="riga-progetto riga-nuovo-progetto">
      <div class="campo-lettera">
        <label for="nuovaLettera">Lettera</label>
        <input type="text" id="nuovaLettera" maxlength="3" placeholder="Y">
      </div>
      <div class="campo-nome">
        <label for="nuovoNomeProgetto">Nome progetto</label>
        <input type="text" id="nuovoNomeProgetto" placeholder="Nome nuovo progetto">
      </div>
      <div class="campo-perc">
        <label for="nuovaPercentuale">Percentuale %</label>
        <input type="text" id="nuovaPercentuale" placeholder="0">
      </div>
      <div class="campo-didascalia">
        <label for="nuovaDidascalia">Didascalia</label>
        <input type="text" id="nuovaDidascalia" placeholder="Testo che comparirà in cassa">
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; min-width:90px;">
        <label style="font-size:0.75rem; color:#777; margin-bottom:4px;">Tocca saldo</label>
        <input type="checkbox" id="nuovaToccaSaldo" checked style="width:20px; height:20px; margin:0;">
      </div>
      <button onclick="salvaNuovoProgetto()" style="max-width: 160px;">Aggiungi</button>
    </div>
    <div id="msgProgetti"></div>
  </div>

  <div class="box-importa">
    <h2>Importa ordine in Cassa</h2>
    <div class="griglia-importa">
      <div class="campo-largo">
        <label for="importaNomeOrdine">Nome ordine (es. "WITT del 12-08-2026")</label>
        <input type="text" id="importaNomeOrdine" placeholder="Nome ordine">
      </div>
      <div>
        <label for="importaLettera">Letterina / progetto</label>
        <select id="importaLettera"></select>
      </div>
      <div></div>
      <div>
        <label for="importaLink1">Link report (1° gruppo, es. soci 1-15)</label>
        <input type="text" id="importaLink1" placeholder="https://...">
      </div>
      <div>
        <label for="importaLink2">Link report (2° gruppo, facoltativo, es. soci 16-30)</label>
        <input type="text" id="importaLink2" placeholder="https://... (lascia vuoto se non serve)">
      </div>
    </div>
    <button class="btn-importa-azione" onclick="leggiReportOrdine()">Leggi report →</button>
    <div id="msgImporta"></div>

    <div id="areaAbbinamento" style="display:none;">
      <div class="tabella-abbinamento" id="tabellaAbbinamento"></div>
      <div class="riepilogo-import" id="riepilogoImport"></div>
      <button class="btn-importa-azione" onclick="confermaImportazione()" style="margin-top:14px; background: var(--terra);">Conferma importazione in Cassa</button>
    </div>
  </div>

  <div class="box-cassa">
    <h2>Foglio Cassa</h2>
    <div class="riga-scelta-socio">
      <div class="campo">
        <label for="cassaSceltaSocio">Scegli socio</label>
        <select id="cassaSceltaSocio" onchange="document.getElementById('areaScontrino').style.display='none';"></select>
      </div>
      <button onclick="apriCassaSocio()">Apri cassa →</button>
    </div>

    <div id="areaScontrino">
      <div class="intestazione-scontrino">
        <div class="nome-socio" id="cassaNomeSocio"></div>
        <div class="saldo-attuale" id="cassaSaldoAttuale"></div>
      </div>
      <div class="fascia-lettere" id="cassaFasciaLettere"></div>

      <div class="intestazione-scontrino-colonne">
        <div>Data</div>
        <div>Descrizione</div>
        <div style="text-align:right;">Importo</div>
        <div style="text-align:right;">Saldo</div>
      </div>
      <div class="contenitore-scontrino" id="contenitoreScontrino"></div>

      <div class="box-nuovo-versamento">
        <div class="riga-versamento-form">
          <div class="campo">
            <label for="versamentoData">Data</label>
            <input type="date" id="versamentoData">
          </div>
          <div class="campo">
            <label for="versamentoImporto">Importo €</label>
            <input type="text" id="versamentoImporto" placeholder="es. 50">
          </div>
          <div class="campo">
            <label for="versamentoMetodo">Metodo</label>
            <select id="versamentoMetodo">
              <option value="contanti">Contanti</option>
              <option value="paypal">PayPal</option>
              <option value="bonifico">Bonifico</option>
            </select>
          </div>
          <div class="campo" style="flex:2;">
            <label for="versamentoNota">Nota (facoltativa)</label>
            <input type="text" id="versamentoNota" placeholder="es. Versamento di cassa">
          </div>
          <button onclick="aggiungiVersamento()">Aggiungi versamento</button>
        </div>
        <div id="msgVersamento"></div>
      </div>
    </div>
  </div>

  <div class="contatore" id="contatore"></div>
  <div class="contenitore-tabella">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>PIN</th>
          <th>Socio dal</th>
          <th>Rinnovo</th>
          <th>Attivo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpoTabella"></tbody>
    </table>
  </div>
</div>

<script>
const ADMIN_TOKEN_KEY = "ti_admin_token";

// Converte una data AAAA-MM-GG (formato del database) in GG/MM/AAAA
// (formato italiano), solo per la visualizzazione. Se la data manca
// o non è nel formato atteso, restituisce una stringa vuota.
function formattaDataItaliana(dataIso) {
  if (!dataIso) return "";
  const parti = dataIso.split("-");
  if (parti.length !== 3) return dataIso;
  const [anno, mese, giorno] = parti;
  return `${giorno}/${mese}/${anno}`;
}

async function loginAdmin() {
  const password = document.getElementById("password").value;
  const errore = document.getElementById("errore");
  errore.textContent = "";

  if (!password) {
    errore.textContent = "Scrivi la password.";
    return;
  }

  const risposta = await fetch("/api/admin-login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    errore.textContent = dati.errore || "Password errata.";
    return;
  }

  localStorage.setItem(ADMIN_TOKEN_KEY, dati.token);
  mostraPannello();
  caricaProgetti();
}

async function mostraPannello() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  if (!token) return;

  const risposta = await fetch("/api/admin-soci", {
    headers: { Authorization: "Bearer " + token },
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    localStorage.removeItem(ADMIN_TOKEN_KEY);
    return;
  }

  document.getElementById("cardLogin").style.display = "none";
  document.getElementById("pannello").style.display = "block";

  const corpo = document.getElementById("corpoTabella");
  corpo.innerHTML = "";
  dati.soci.forEach((s) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.nome}</td>
      <td>${s.pin}</td>
      <td>${formattaDataItaliana(s.socio_dal)}</td>
      <td>${formattaDataItaliana(s.rinnovo_corrente)}</td>
      <td></td>
      <td></td>
    `;
    const cellaInterruttore = tr.children[4];
    const interruttore = document.createElement("button");
    interruttore.className = "interruttore" + (s.attivo ? " on" : "");
    interruttore.title = s.attivo ? "Clicca per disattivare" : "Clicca per attivare";
    interruttore.innerHTML = '<span class="pallino"></span>';
    interruttore.onclick = () => toggleSocio(s.id, interruttore);
    cellaInterruttore.appendChild(interruttore);

    const cellaElimina = tr.children[5];
    const bottoneElimina = document.createElement("button");
    bottoneElimina.className = "btn-elimina";
    bottoneElimina.textContent = "Elimina";
    bottoneElimina.onclick = () => eliminaSocio(s.id, s.nome, tr);
    cellaElimina.appendChild(bottoneElimina);

    corpo.appendChild(tr);
  });

  document.getElementById("contatore").textContent = dati.soci.length + " soci totali";
}

async function toggleSocio(id, bottone) {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const staAttivando = !bottone.classList.contains("on"); // era spento, sto per accenderlo

  let data_rinnovo = "";
  if (staAttivando) {
    const oggi = new Date().toISOString().slice(0, 10);
    const dataInserita = prompt(
      "Data di rinnovo/iscrizione (formato AAAA-MM-GG):",
      oggi
    );
    if (dataInserita === null) return; // ha annullato, non facciamo nulla
    data_rinnovo = dataInserita.trim();
  }

  bottone.disabled = true;

  const risposta = await fetch("/api/admin-attiva-socio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ id, data_rinnovo }),
  });
  const dati = await risposta.json();

  bottone.disabled = false;

  if (!dati.ok) {
    alert(dati.errore || "Errore durante il cambio di stato.");
    return;
  }

  bottone.classList.toggle("on", dati.attivo === 1);
  bottone.title = dati.attivo ? "Clicca per disattivare" : "Clicca per attivare";

  // Se ho appena riattivato con una nuova data, ricarico la tabella
  // per mostrare subito la data di rinnovo aggiornata.
  if (staAttivando) {
    mostraPannello();
  }
}

async function eliminaSocio(id, nome, riga) {
  const confermato = confirm(
    "Eliminare definitivamente " + nome + "?\n\nQuesta azione non si può annullare. Se il socio ha solo bisogno di essere sospeso, usa l'interruttore invece di eliminarlo."
  );
  if (!confermato) return;

  const token = localStorage.getItem(ADMIN_TOKEN_KEY);

  const risposta = await fetch("/api/admin-elimina-socio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ id }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    alert(dati.errore || "Errore durante l'eliminazione.");
    return;
  }

  riga.remove();
  const totale = document.getElementById("corpoTabella").children.length;
  document.getElementById("contatore").textContent = totale + " soci totali";
}

async function aggiungiSocio() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome = document.getElementById("nuovoNome").value.trim();
  const pin = document.getElementById("nuovoPin").value.trim();
  const socio_dal = document.getElementById("nuovaData").value;
  const msg = document.getElementById("msgAggiungi");
  msg.textContent = "";
  msg.className = "";

  if (!nome || !pin || !socio_dal) {
    msg.textContent = "Compila tutti i campi.";
    msg.className = "errore-msg";
    return;
  }

  const risposta = await fetch("/api/admin-aggiungi-socio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ nome, pin, socio_dal }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    msg.textContent = dati.errore || "Errore durante l'aggiunta.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Socio aggiunto.";
  msg.className = "ok";
  document.getElementById("nuovoNome").value = "";
  document.getElementById("nuovoPin").value = "";
  document.getElementById("nuovaData").value = "";

  mostraPannello();

  // Se c'è un'importazione ordine in corso (abbinamento nomi ancora aperto),
  // aggiorno l'elenco soci usato dalle tendine senza perdere il lavoro già
  // fatto — così il socio appena tesserato compare subito, senza dover
  // ricominciare l'abbinamento da capo.
  const areaAbbinamentoAperta = document.getElementById("areaAbbinamento").style.display !== "none";
  if (areaAbbinamentoAperta) {
    const rispostaSoci = await fetch("/api/admin-soci", {
      headers: { Authorization: "Bearer " + token },
    });

    if (datiSoci.ok) {
      elencoSociGlobale = datiSoci.soci;
      disegnaTabellaAbbinamento();
    }
  }

  // Aggiorno anche la tendina del Foglio Cassa, per lo stesso motivo
  await popolaMenuSociCassa();
}

// Tiene in memoria, tra un passo e l'altro, l'elenco soci e gli abbinamenti
// scelti dall'admin, così "Conferma importazione" sa cosa scrivere in Cassa.
let elencoAbbinamento = [];
let elencoSociGlobale = [];

async function popolaMenuLettere() {

  const risposta = await fetch("/api/admin-progetti", {

async function leggiReportOrdine() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome_ordine = document.getElementById("importaNomeOrdine").value.trim();
  const link1 = document.getElementById("importaLink1").value.trim();
  const link2 = document.getElementById("importaLink2").value.trim();
  const msg = document.getElementById("msgImporta");
  msg.textContent = "";
  msg.className = "";
  document.getElementById("areaAbbinamento").style.display = "none";

  if (!nome_ordine || !link1) {
    msg.textContent = "Servono almeno il nome ordine e il primo link.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Lettura del report in corso...";

  // Passo 1: leggo i CSV e ottengo l'elenco soci con i totali
  const rispostaLettura = await fetch("/api/admin-leggi-report", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ link1, link2 }),
  });
  const datiLettura = await rispostaLettura.json();

  if (!datiLettura.ok) {
    msg.textContent = datiLettura.errore || "Errore durante la lettura del report.";
    msg.className = "errore-msg";
    return;
  }

  if (datiLettura.soci_trovati.length === 0) {
    msg.textContent = "Nessun socio con un ordine trovato in questo report.";
    msg.className = "errore-msg";
    return;
  }

  // Passo 2: provo ad abbinare ogni nome scritto a un socio vero
  const rispostaAbbina = await fetch("/api/admin-risolvi-nomi", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ soci_trovati: datiLettura.soci_trovati }),
  });
  const datiAbbina = await rispostaAbbina.json();

  if (!datiAbbina.ok) {
    msg.textContent = datiAbbina.errore || "Errore durante l'abbinamento dei nomi.";
    msg.className = "errore-msg";
    return;
  }

  elencoSociGlobale = datiAbbina.elenco_soci;
  elencoAbbinamento = datiAbbina.risultato.map((r) => ({
    nome_scritto: r.nome_scritto,
    totale: r.totale,
    prodotti: r.prodotti || null,
    socio_id: r.socio_id, // null se non riconosciuto
    dedotto_da_numero: r.dedotto_da_numero || false,
    nome_base_dedotto: r.nome_base_dedotto || null,
    saltato: false,
  }));

  msg.textContent = "";
  document.getElementById("areaAbbinamento").style.display = "block";
  disegnaTabellaAbbinamento();
}

function disegnaTabellaAbbinamento() {
  const contenitore = document.getElementById("tabellaAbbinamento");
  contenitore.innerHTML = "";

  elencoAbbinamento.forEach((riga, indice) => {
    const div = document.createElement("div");
    div.className = "riga-abbinamento";

    const totaleTesto = riga.totale.toFixed(2).replace(".", ",");

    let statoHtml = "";
    if (riga.saltato) {
      statoHtml = '<span class="badge-saltato">Saltato — non importato</span>';
    } else if (riga.socio_id && !riga.dedotto_da_numero) {
      // Abbinamento certo: soprannome salvato o nome esatto
      const socioTrovato = elencoSociGlobale.find((s) => s.id === riga.socio_id);
      const nomeSocio = socioTrovato ? socioTrovato.nome : "id " + riga.socio_id;
      statoHtml = '<span class="badge-riconosciuto">✓ ' + nomeSocio + "</span>";
    } else {
      // Non riconosciuto, oppure dedotto togliendo un numero (es. "Maria 2"):
      // in entrambi i casi mostro sempre una tendina, pre-selezionata con il
      // suggerimento se c'è — così l'ultima parola resta sempre a chi importa,
      // utile con nomi simili tra loro (es. Maria, Mariarosa, Rosa).
      statoHtml = costruisciSelectAbbinamento(indice, riga.socio_id);
    }

    div.innerHTML = `
      <div class="nome-scritto">${riga.nome_scritto}</div>
      <div class="totale-scritto">€ ${totaleTesto}</div>
      <div class="stato-abbinamento" data-indice="${indice}">${statoHtml}</div>
    `;
    contenitore.appendChild(div);

    // Se ho appena disegnato una select, collego l'evento di cambio
    const selectDisegnata = div.querySelector("select");
    if (selectDisegnata) {
      selectDisegnata.onchange = () => scegliAbbinamento(indice, selectDisegnata.value);
    }
  });

  aggiornaRiepilogoImport();
}

function costruisciSelectAbbinamento(indice, socioPreselezionato) {
  let opzioni = '<option value="">— scegli socio o salta —</option>';
  opzioni += '<option value="salta">Salta (socio non ancora tesserato / da ignorare)</option>';
  elencoSociGlobale.forEach((s) => {
    const selezionato = socioPreselezionato && s.id === socioPreselezionato ? " selected" : "";
    opzioni += `<option value="${s.id}"${selezionato}>${s.nome}</option>`;
  });
  return `<select>${opzioni}</select>`;
}

async function scegliAbbinamento(indice, valoreScelto) {
  if (!valoreScelto) return;

  if (valoreScelto === "salta") {
    elencoAbbinamento[indice].saltato = true;
    disegnaTabellaAbbinamento();
    return;
  }

  const socio_id = parseInt(valoreScelto, 10);
  const nomeScritto = elencoAbbinamento[indice].nome_scritto;
  elencoAbbinamento[indice].socio_id = socio_id;

  const selectEl = elencoSociGlobale.find((s) => s.id === socio_id);
  const nomeSocio = selectEl ? selectEl.nome : "questo socio";

  const ricordaPerSempre = confirm(
    `Ricordare "${nomeScritto}" = ${nomeSocio} anche per le prossime volte?\n\n` +
    `OK = ricorda per sempre (la volta prossima verrà riconosciuto da solo)\n` +
    `Annulla = solo per questa importazione (te lo richiederò di nuovo la prossima volta — utile se questo nome potrebbe appartenere a soci diversi in momenti diversi)`
  );

  if (ricordaPerSempre) {
    const token = localStorage.getItem(ADMIN_TOKEN_KEY);
    await fetch("/api/admin-salva-soprannome", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token,
      },
      body: JSON.stringify({ soprannome: nomeScritto, socio_id }),
    });
  }

  disegnaTabellaAbbinamento();
}

function aggiornaRiepilogoImport() {
  const riconosciuti = elencoAbbinamento.filter((r) => r.socio_id && !r.saltato).length;
  const daAbbinare = elencoAbbinamento.filter((r) => !r.socio_id && !r.saltato).length;
  const saltati = elencoAbbinamento.filter((r) => r.saltato).length;

  document.getElementById("riepilogoImport").innerHTML =
    `<strong>${riconosciuti}</strong> pronti per l'importazione, ` +
    `<strong>${daAbbinare}</strong> ancora da abbinare, ` +
    `<strong>${saltati}</strong> saltati.`;
}

async function confermaImportazione() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome_ordine = document.getElementById("importaNomeOrdine").value.trim();
  const lettera = document.getElementById("importaLettera").value;
  const msg = document.getElementById("msgImporta");

  const daAbbinare = elencoAbbinamento.filter((r) => !r.socio_id && !r.saltato);
  if (daAbbinare.length > 0) {
    msg.textContent = "Ci sono ancora " + daAbbinare.length + " soci da abbinare o saltare prima di importare.";
    msg.className = "errore-msg";
    return;
  }

  const righeDaImportare = elencoAbbinamento
    .filter((r) => r.socio_id && !r.saltato)
    .map((r) => ({
      socio_id: r.socio_id,
      totale: r.totale,
      prodotti: r.prodotti,
      nome_scritto: r.nome_scritto,
    }));

  if (righeDaImportare.length === 0) {
    msg.textContent = "Nessuna riga da importare (tutte saltate).";
    msg.className = "errore-msg";
    return;
  }

  const confermato = confirm(
    `Confermi l'importazione di ${righeDaImportare.length} righe per l'ordine "${nome_ordine}" (progetto ${lettera})?\n\nQuesta azione scrive dati permanenti in Cassa.`
  );
  if (!confermato) return;

  msg.textContent = "Importazione in corso...";
  msg.className = "";

  const risposta = await fetch("/api/admin-importa-ordine", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ nome_ordine, lettera, righe: righeDaImportare }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    msg.textContent = dati.errore || "Errore durante l'importazione.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Importazione completata: " + dati.righe_importate + " righe scritte in Cassa.";
  msg.className = "ok";
  document.getElementById("areaAbbinamento").style.display = "none";
  document.getElementById("importaNomeOrdine").value = "";
  document.getElementById("importaLink1").value = "";
  document.getElementById("importaLink2").value = "";
  elencoAbbinamento = [];
}

async function caricaCassaSocio(socio_id) {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const risposta = await fetch("/api/admin-cassa-socio?socio_id=" + socio_id, {
    headers: { Authorization: "Bearer " + token },
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    alert(dati.errore || "Errore durante il caricamento della cassa.");
    return;
  }

  socioCassaAperta = socio_id;
  document.getElementById("cassaSceltaSocio").value = socio_id;
  document.getElementById("areaScontrino").style.display = "block";
  document.getElementById("cassaNomeSocio").textContent = dati.socio.nome;

  const saldoTesto = dati.saldo_attuale.toFixed(2).replace(".", ",");
  document.getElementById("cassaSaldoAttuale").textContent = "Saldo: € " + saldoTesto;

  // Fascia con i totali per letterina (le "colonne nascoste" richieste)
  const fascia = document.getElementById("cassaFasciaLettere");
  fascia.innerHTML = "";
  Object.keys(dati.totali_per_lettera).forEach((lettera) => {
    const importo = dati.totali_per_lettera[lettera].toFixed(2).replace(".", ",");
    const chip = document.createElement("div");
    chip.className = "chip-lettera";
    chip.innerHTML = `<strong>${lettera}</strong>: € ${importo}`;
    fascia.appendChild(chip);
  });

  disegnaScontrino(dati.righe);
}

function disegnaScontrino(righe) {
  const contenitore = document.getElementById("contenitoreScontrino");
  contenitore.innerHTML = "";

  righe.forEach((r, indice) => {
    const div = document.createElement("div");
    div.className = "riga-scontrino" + (r.tipo === "versamento" ? " versamento" : "");

    const dataItaliana = formattaDataItaliana(r.data);
    const importoTesto = r.importo_totale.toFixed(2).replace(".", ",");
    const saldoTesto = r.saldo_dopo.toFixed(2).replace(".", ",");
    const segno = r.tipo === "versamento" ? "+" : "-";
    const classeImporto = r.tipo === "versamento" ? "positivo" : "negativo";

    let notaMaggiorazione = "";
    if (r.lettera && r.maggiorazione) {
      const maggTesto = r.maggiorazione.toFixed(2).replace(".", ",");
      const didasc = r.didascalia || (r.nome_progetto || r.lettera);
      notaMaggiorazione = `<span class="nota-maggiorazione">${r.lettera} — ${didasc}: € ${maggTesto}</span>`;
    }

    // Se ci sono prodotti, aggiungo un piccolo link per aprire/chiudere il dettaglio
    let linkDettaglio = "";
    const idDettaglio = "dettaglio-riga-" + indice;
    if (r.prodotti && r.prodotti.length > 0) {
      linkDettaglio = `<span class="nota-maggiorazione" style="cursor:pointer; color: var(--terra); text-decoration: underline;" onclick="document.getElementById('${idDettaglio}').style.display = document.getElementById('${idDettaglio}').style.display === 'none' ? 'block' : 'none';">Vedi ${r.prodotti.length} prodotti acquistati ▾</span>`;
    }

    div.innerHTML = `
      <div class="data-scontrino">${dataItaliana}</div>
      <div class="descrizione-scontrino">${r.descrizione}${notaMaggiorazione}${linkDettaglio}</div>
      <div class="importo-scontrino ${classeImporto}">${segno} € ${importoTesto}</div>
      <div class="saldo-scontrino">€ ${saldoTesto}</div>
    `;
    contenitore.appendChild(div);

    // Riga aggiuntiva, nascosta di default, con l'elenco prodotti già scontati
    if (r.prodotti && r.prodotti.length > 0) {
      const rigaDettaglio = document.createElement("div");
      rigaDettaglio.id = idDettaglio;
      rigaDettaglio.style.cssText =
        "display:none; grid-column: 1 / -1; background:#faf8f3; padding:10px 14px 10px 100px; font-size:0.85rem; border-bottom:1px solid #f0f0f0;";
      rigaDettaglio.innerHTML = r.prodotti
        .map((p) => {
          const prezzo = (p.prezzo_scontato != null ? p.prezzo_scontato : p.prezzo_netto || 0)
            .toFixed(2)
            .replace(".", ",");
          return `<div style="display:flex; justify-content:space-between; padding:2px 0;">
            <span>${p.prodotto}${p.formato && p.formato !== "-" ? " (" + p.formato + ")" : ""} × ${p.quantita}</span>
            <span>€ ${prezzo}</span>
          </div>`;
        })
        .join("");
      contenitore.appendChild(rigaDettaglio);
    }
  });

  // Si apre mostrando subito l'ultima riga (il movimento più recente)
  contenitore.scrollTop = contenitore.scrollHeight;
}

async function aggiungiVersamento() {
  if (!socioCassaAperta) return;

  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const data = document.getElementById("versamentoData").value;
  const importo = document.getElementById("versamentoImporto").value.trim();
  const metodo_pagamento = document.getElementById("versamentoMetodo").value;
  const nota = document.getElementById("versamentoNota").value.trim();
  const msg = document.getElementById("msgVersamento");
  msg.textContent = "";
  msg.className = "";

  if (!data || !importo) {
    msg.textContent = "Servono almeno data e importo.";
    msg.className = "errore-msg";
    return;
  }

  const descrizione = nota || "Versamento";

  const risposta = await fetch("/api/admin-aggiungi-versamento", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({
      socio_id: socioCassaAperta,
      data,
      descrizione,
      importo,
      metodo_pagamento,
    }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    msg.textContent = dati.errore || "Errore durante l'aggiunta del versamento.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Versamento aggiunto.";
  msg.className = "ok";
  document.getElementById("versamentoImporto").value = "";
  document.getElementById("versamentoNota").value = "";

  // Ricarico la cassa per mostrare subito il nuovo movimento
  caricaCassaSocio(socioCassaAperta);
}

(async function avvia() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  if (token) {
    await mostraPannello();
    await caricaProgetti();
    await popolaMenuLettere();
    await popolaMenuSociCassa();
  }
})();
</script>
