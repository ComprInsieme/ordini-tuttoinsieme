<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuttoInsieme - Pannello Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #6a9c78;
    --crema: #fdf8f0;
    --terra: #b5651d;
    --testo: #3a3a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef3ea, #fdf8f0);
    font-family: 'Nunito', sans-serif;
    color: var(--testo);
    padding: 20px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    padding: 30px;
    max-width: 420px;
    margin: 60px auto;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 16px;
    border: 2px solid #e2e2e2;
    font-size: 1rem;
    margin-top: 10px;
    font-family: inherit;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 20px;
    background: var(--verde);
    color: white;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.05rem;
    cursor: pointer;
  }
  #errore {
    color: #c0392b;
    text-align: center;
    margin-top: 12px;
    font-weight: 600;
  }
  #pannello { display: none; max-width: 960px; margin: 0 auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
  }
  th {
    background: var(--verde);
    color: white;
    font-family: 'Baloo 2', sans-serif;
  }
  .attivo { color: var(--verde); font-weight: 700; }
  .disattivo { color: #999; }
  .contatore {
    text-align: center;
    margin-bottom: 16px;
    color: #777;
  }

  /* --- Modulo aggiungi socio --- */
  .box-aggiungi {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-aggiungi h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .riga-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .riga-form .campo {
    flex: 1;
    min-width: 140px;
  }
  .riga-form label {
    font-size: 0.8rem;
    color: #777;
    display: block;
    margin-bottom: 2px;
  }
  .riga-form input { margin-top: 0; }
  .riga-form button {
    width: auto;
    margin-top: 0;
    padding: 12px 20px;
    white-space: nowrap;
  }
  #msgAggiungi {
    margin-top: 10px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgAggiungi.ok { color: var(--verde); }
  #msgAggiungi.errore-msg { color: #c0392b; }

  /* --- Interruttore attivo/disattivo --- */
  .interruttore {
    width: 44px;
    height: 24px;
    border-radius: 12px;
    border: none;
    position: relative;
    cursor: pointer;
    padding: 0;
    background: #ccc;
    transition: background 0.15s;
  }
  .interruttore.on { background: var(--verde); }
  .interruttore .pallino {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.15s;
  }
  .interruttore.on .pallino { left: 22px; }

  /* --- Pulsante elimina --- */
  .btn-elimina {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    border-radius: 12px;
    background: #fff;
    color: #c0392b;
    border: 2px solid #f0d0cc;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-elimina:hover { background: #fdf1ef; }

  /* --- Pannello progetti/letterine --- */
  .box-progetti {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-progetti h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .riga-progetto {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .riga-progetto:last-of-type { border-bottom: none; }
  .riga-progetto .campo-lettera { width: 70px; }
  .riga-progetto .campo-nome { flex: 1; min-width: 130px; }
  .riga-progetto .campo-perc { width: 100px; }
  .riga-progetto .campo-didascalia { flex: 2; min-width: 220px; }
  .riga-progetto label {
    font-size: 0.75rem;
    color: #777;
    display: block;
    margin-bottom: 2px;
  }
  .riga-progetto input { margin-top: 0; padding: 8px 10px; }
  .riga-progetto button {
    width: auto;
    margin-top: 0;
    padding: 10px 16px;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .riga-nuovo-progetto {
    border-top: 2px dashed #ddd;
    margin-top: 6px;
    padding-top: 16px;
  }
  #msgProgetti {
    margin-top: 10px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgProgetti.ok { color: var(--verde); }
  #msgProgetti.errore-msg { color: #c0392b; }

  /* --- Importa Ordine --- */
  .box-importa {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 24px;
  }
  .box-importa h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--verde);
    margin-top: 0;
    font-size: 1.1rem;
  }
  .griglia-importa {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  .griglia-importa .campo-largo { grid-column: 1 / -1; }
  .griglia-importa label {
    font-size: 0.8rem;
    color: #777;
    display: block;
    margin-bottom: 4px;
  }
  .griglia-importa input, .griglia-importa select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #e2e2e2;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .btn-importa-azione {
    width: auto;
    margin-top: 0;
    padding: 12px 22px;
    font-size: 0.95rem;
  }
  #msgImporta {
    margin-top: 12px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #msgImporta.ok { color: var(--verde); }
  #msgImporta.errore-msg { color: #c0392b; }

  .tabella-abbinamento {
    margin-top: 20px;
    border-top: 2px dashed #ddd;
    padding-top: 16px;
  }
  .riga-abbinamento {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  .riga-abbinamento .nome-scritto {
    flex: 1;
    min-width: 160px;
    font-weight: 600;
  }
  .riga-abbinamento .totale-scritto {
    width: 90px;
    color: #555;
  }
  .riga-abbinamento .stato-abbinamento {
    flex: 2;
    min-width: 220px;
  }
  .badge-riconosciuto {
    background: #e6f2ea;
    color: var(--verde);
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .badge-saltato {
    background: #f0f0f0;
    color: #888;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .riga-abbinamento select {
    padding: 6px 10px;
    border-radius: 10px;
    border: 2px solid #e2e2e2;
    font-family: inherit;
    max-width: 260px;
  }
  .riepilogo-import {
    background: var(--crema);
    border-radius: 12px;
    padding: 14px;
    margin-top: 16px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="card" id="cardLogin">
  <h1>Pannello Admin</h1>
  <input type="password" id="password" placeholder="Password amministratore">
  <button onclick="loginAdmin()">Entra</button>
  <div id="errore"></div>
</div>

<div id="pannello">
  <h1>Elenco Soci</h1>

  <div class="box-aggiungi">
    <h2>Aggiungi socio</h2>
    <div class="riga-form">
      <div class="campo">
        <label for="nuovoNome">Nome e cognome</label>
        <input type="text" id="nuovoNome" placeholder="Mario Rossi">
      </div>
      <div class="campo">
        <label for="nuovoPin">PIN</label>
        <input type="text" id="nuovoPin" placeholder="4 cifre" maxlength="4">
      </div>
      <div class="campo">
        <label for="nuovaData">Socio dal</label>
        <input type="date" id="nuovaData">
      </div>
      <button onclick="aggiungiSocio()" style="max-width: 160px;">Aggiungi</button>
    </div>
    <div id="msgAggiungi"></div>
  </div>

  <div class="box-progetti">
    <h2>Progetti / Letterine</h2>
    <div id="elencoProgetti"></div>

    <div class="riga-progetto riga-nuovo-progetto">
      <div class="campo-lettera">
        <label for="nuovaLettera">Lettera</label>
        <input type="text" id="nuovaLettera" maxlength="3" placeholder="Y">
      </div>
      <div class="campo-nome">
        <label for="nuovoNomeProgetto">Nome progetto</label>
        <input type="text" id="nuovoNomeProgetto" placeholder="Nome nuovo progetto">
      </div>
      <div class="campo-perc">
        <label for="nuovaPercentuale">Percentuale %</label>
        <input type="text" id="nuovaPercentuale" placeholder="0">
      </div>
      <div class="campo-didascalia">
        <label for="nuovaDidascalia">Didascalia</label>
        <input type="text" id="nuovaDidascalia" placeholder="Testo che comparirà in cassa">
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; min-width:90px;">
        <label style="font-size:0.75rem; color:#777; margin-bottom:4px;">Tocca saldo</label>
        <input type="checkbox" id="nuovaToccaSaldo" checked style="width:20px; height:20px; margin:0;">
      </div>
      <button onclick="salvaNuovoProgetto()" style="max-width: 160px;">Aggiungi</button>
    </div>
    <div id="msgProgetti"></div>
  </div>

  <div class="box-importa">
    <h2>Importa ordine in Cassa</h2>
    <div class="griglia-importa">
      <div class="campo-largo">
        <label for="importaNomeOrdine">Nome ordine (es. "WITT del 12-08-2026")</label>
        <input type="text" id="importaNomeOrdine" placeholder="Nome ordine">
      </div>
      <div>
        <label for="importaLettera">Letterina / progetto</label>
        <select id="importaLettera"></select>
      </div>
      <div></div>
      <div>
        <label for="importaLink1">Link report (1° gruppo, es. soci 1-15)</label>
        <input type="text" id="importaLink1" placeholder="https://...">
      </div>
      <div>
        <label for="importaLink2">Link report (2° gruppo, facoltativo, es. soci 16-30)</label>
        <input type="text" id="importaLink2" placeholder="https://... (lascia vuoto se non serve)">
      </div>
    </div>
    <button class="btn-importa-azione" onclick="leggiReportOrdine()">Leggi report →</button>
    <div id="msgImporta"></div>

    <div id="areaAbbinamento" style="display:none;">
      <div class="tabella-abbinamento" id="tabellaAbbinamento"></div>
      <div class="riepilogo-import" id="riepilogoImport"></div>
      <button class="btn-importa-azione" onclick="confermaImportazione()" style="margin-top:14px; background: var(--terra);">Conferma importazione in Cassa</button>
    </div>
  </div>

  <div class="contatore" id="contatore"></div>
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>PIN</th>
        <th>Socio dal</th>
        <th>Rinnovo</th>
        <th>Attivo</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="corpoTabella"></tbody>
  </table>
</div>

<script>
const ADMIN_TOKEN_KEY = "ti_admin_token";

async function loginAdmin() {
  const password = document.getElementById("password").value;
  const errore = document.getElementById("errore");
  errore.textContent = "";

  if (!password) {
    errore.textContent = "Scrivi la password.";
    return;
  }

  const risposta = await fetch("/api/admin-login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    errore.textContent = dati.errore || "Password errata.";
    return;
  }

  localStorage.setItem(ADMIN_TOKEN_KEY, dati.token);
  mostraPannello();
  caricaProgetti();
}

async function mostraPannello() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  if (!token) return;

  const risposta = await fetch("/api/admin-soci", {
    headers: { Authorization: "Bearer " + token },
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    localStorage.removeItem(ADMIN_TOKEN_KEY);
    return;
  }

  document.getElementById("cardLogin").style.display = "none";
  document.getElementById("pannello").style.display = "block";

  const corpo = document.getElementById("corpoTabella");
  corpo.innerHTML = "";
  dati.soci.forEach((s) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.nome}</td>
      <td>${s.pin}</td>
      <td>${s.socio_dal || ""}</td>
      <td>${s.rinnovo_corrente || ""}</td>
      <td></td>
      <td></td>
    `;
    const cellaInterruttore = tr.children[4];
    const interruttore = document.createElement("button");
    interruttore.className = "interruttore" + (s.attivo ? " on" : "");
    interruttore.title = s.attivo ? "Clicca per disattivare" : "Clicca per attivare";
    interruttore.innerHTML = '<span class="pallino"></span>';
    interruttore.onclick = () => toggleSocio(s.id, interruttore);
    cellaInterruttore.appendChild(interruttore);

    const cellaElimina = tr.children[5];
    const bottoneElimina = document.createElement("button");
    bottoneElimina.className = "btn-elimina";
    bottoneElimina.textContent = "Elimina";
    bottoneElimina.onclick = () => eliminaSocio(s.id, s.nome, tr);
    cellaElimina.appendChild(bottoneElimina);

    corpo.appendChild(tr);
  });

  document.getElementById("contatore").textContent = dati.soci.length + " soci totali";
}

async function toggleSocio(id, bottone) {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  bottone.disabled = true;

  const risposta = await fetch("/api/admin-attiva-socio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ id }),
  });
  const dati = await risposta.json();

  bottone.disabled = false;

  if (!dati.ok) {
    alert(dati.errore || "Errore durante il cambio di stato.");
    return;
  }

  bottone.classList.toggle("on", dati.attivo === 1);
  bottone.title = dati.attivo ? "Clicca per disattivare" : "Clicca per attivare";
}

async function eliminaSocio(id, nome, riga) {
  const confermato = confirm(
    "Eliminare definitivamente " + nome + "?\n\nQuesta azione non si può annullare. Se il socio ha solo bisogno di essere sospeso, usa l'interruttore invece di eliminarlo."
  );
  if (!confermato) return;

  const token = localStorage.getItem(ADMIN_TOKEN_KEY);

  const risposta = await fetch("/api/admin-elimina-socio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ id }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    alert(dati.errore || "Errore durante l'eliminazione.");
    return;
  }

  riga.remove();
  const totale = document.getElementById("corpoTabella").children.length;
  document.getElementById("contatore").textContent = totale + " soci totali";
}

async function aggiungiSocio() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome = document.getElementById("nuovoNome").value.trim();
  const pin = document.getElementById("nuovoPin").value.trim();
  const socio_dal = document.getElementById("nuovaData").value;
  const msg = document.getElementById("msgAggiungi");
  msg.textContent = "";
  msg.className = "";

  if (!nome || !pin || !socio_dal) {
    msg.textContent = "Compila tutti i campi.";
    msg.className = "errore-msg";
    return;
  }

  const risposta = await fetch("/api/admin-aggiungi-socio", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ nome, pin, socio_dal }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    msg.textContent = dati.errore || "Errore durante l'aggiunta.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Socio aggiunto.";
  msg.className = "ok";
  document.getElementById("nuovoNome").value = "";
  document.getElementById("nuovoPin").value = "";
  document.getElementById("nuovaData").value = "";

  mostraPannello();
}

async function caricaProgetti() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const risposta = await fetch("/api/admin-progetti", {
    headers: { Authorization: "Bearer " + token },
  });
  const dati = await risposta.json();

  if (!dati.ok) return;

  const contenitore = document.getElementById("elencoProgetti");
  contenitore.innerHTML = "";

  dati.progetti.forEach((p) => {
    const riga = document.createElement("div");
    riga.className = "riga-progetto";
    riga.innerHTML = `
      <div class="campo-lettera">
        <label>Lettera</label>
        <input type="text" value="${p.lettera}" disabled style="background:#f5f5f5;">
      </div>
      <div class="campo-nome">
        <label>Nome progetto</label>
        <input type="text" class="campo-modifica-nome" value="${p.nome_progetto}">
      </div>
      <div class="campo-perc">
        <label>Percentuale %</label>
        <input type="text" class="campo-modifica-perc" value="${p.percentuale}">
      </div>
      <div class="campo-didascalia">
        <label>Didascalia</label>
        <input type="text" class="campo-modifica-didascalia" value="${p.didascalia || ""}">
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; min-width:90px;">
        <label style="font-size:0.75rem; color:#777; margin-bottom:4px;">Tocca saldo</label>
        <input type="checkbox" class="campo-modifica-tocca-saldo" ${p.tocca_saldo ? "checked" : ""} style="width:20px; height:20px; margin:0;">
      </div>
      <button>Salva</button>
    `;
    const bottone = riga.querySelector("button");
    bottone.onclick = () => salvaModificaProgetto(p.lettera, riga, bottone);
    contenitore.appendChild(riga);
  });
}

async function salvaModificaProgetto(lettera, riga, bottone) {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome_progetto = riga.querySelector(".campo-modifica-nome").value.trim();
  const percentuale = riga.querySelector(".campo-modifica-perc").value.trim();
  const didascalia = riga.querySelector(".campo-modifica-didascalia").value.trim();
  const tocca_saldo = riga.querySelector(".campo-modifica-tocca-saldo").checked;

  bottone.disabled = true;
  bottone.textContent = "Salvataggio...";

  const risposta = await fetch("/api/admin-salva-progetto", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ lettera, nome_progetto, percentuale, didascalia, tocca_saldo }),
  });
  const dati = await risposta.json();

  bottone.disabled = false;
  bottone.textContent = "Salva";

  if (!dati.ok) {
    alert(dati.errore || "Errore durante il salvataggio.");
    return;
  }
}

async function salvaNuovoProgetto() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const lettera = document.getElementById("nuovaLettera").value.trim();
  const nome_progetto = document.getElementById("nuovoNomeProgetto").value.trim();
  const percentuale = document.getElementById("nuovaPercentuale").value.trim() || "0";
  const didascalia = document.getElementById("nuovaDidascalia").value.trim();
  const tocca_saldo = document.getElementById("nuovaToccaSaldo").checked;
  const msg = document.getElementById("msgProgetti");
  msg.textContent = "";
  msg.className = "";

  if (!lettera || !nome_progetto) {
    msg.textContent = "Compila almeno lettera e nome progetto.";
    msg.className = "errore-msg";
    return;
  }

  const risposta = await fetch("/api/admin-salva-progetto", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ lettera, nome_progetto, percentuale, didascalia, tocca_saldo }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    msg.textContent = dati.errore || "Errore durante l'aggiunta.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Progetto aggiunto.";
  msg.className = "ok";
  document.getElementById("nuovaLettera").value = "";
  document.getElementById("nuovoNomeProgetto").value = "";
  document.getElementById("nuovaPercentuale").value = "";
  document.getElementById("nuovaDidascalia").value = "";
  document.getElementById("nuovaToccaSaldo").checked = true;

  caricaProgetti();
}

// ===== IMPORTA ORDINE =====

// Tiene in memoria, tra un passo e l'altro, l'elenco soci e gli abbinamenti
// scelti dall'admin, così "Conferma importazione" sa cosa scrivere in Cassa.
let elencoAbbinamento = [];
let elencoSociGlobale = [];

async function popolaMenuLettere() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const risposta = await fetch("/api/admin-progetti", {
    headers: { Authorization: "Bearer " + token },
  });
  const dati = await risposta.json();
  if (!dati.ok) return;

  const select = document.getElementById("importaLettera");
  select.innerHTML = "";
  dati.progetti.forEach((p) => {
    const opzione = document.createElement("option");
    opzione.value = p.lettera;
    opzione.textContent = p.lettera + " — " + p.nome_progetto;
    select.appendChild(opzione);
  });
}

async function leggiReportOrdine() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome_ordine = document.getElementById("importaNomeOrdine").value.trim();
  const link1 = document.getElementById("importaLink1").value.trim();
  const link2 = document.getElementById("importaLink2").value.trim();
  const msg = document.getElementById("msgImporta");
  msg.textContent = "";
  msg.className = "";
  document.getElementById("areaAbbinamento").style.display = "none";

  if (!nome_ordine || !link1) {
    msg.textContent = "Servono almeno il nome ordine e il primo link.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Lettura del report in corso...";

  // Passo 1: leggo i CSV e ottengo l'elenco soci con i totali
  const rispostaLettura = await fetch("/api/admin-leggi-report", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ link1, link2 }),
  });
  const datiLettura = await rispostaLettura.json();

  if (!datiLettura.ok) {
    msg.textContent = datiLettura.errore || "Errore durante la lettura del report.";
    msg.className = "errore-msg";
    return;
  }

  if (datiLettura.soci_trovati.length === 0) {
    msg.textContent = "Nessun socio con un ordine trovato in questo report.";
    msg.className = "errore-msg";
    return;
  }

  // Passo 2: provo ad abbinare ogni nome scritto a un socio vero
  const rispostaAbbina = await fetch("/api/admin-risolvi-nomi", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ soci_trovati: datiLettura.soci_trovati }),
  });
  const datiAbbina = await rispostaAbbina.json();

  if (!datiAbbina.ok) {
    msg.textContent = datiAbbina.errore || "Errore durante l'abbinamento dei nomi.";
    msg.className = "errore-msg";
    return;
  }

  elencoSociGlobale = datiAbbina.elenco_soci;
  elencoAbbinamento = datiAbbina.risultato.map((r) => ({
    nome_scritto: r.nome_scritto,
    totale: r.totale,
    socio_id: r.socio_id, // null se non riconosciuto
    saltato: false,
  }));

  msg.textContent = "";
  document.getElementById("areaAbbinamento").style.display = "block";
  disegnaTabellaAbbinamento();
}

function disegnaTabellaAbbinamento() {
  const contenitore = document.getElementById("tabellaAbbinamento");
  contenitore.innerHTML = "";

  elencoAbbinamento.forEach((riga, indice) => {
    const div = document.createElement("div");
    div.className = "riga-abbinamento";

    const totaleTesto = riga.totale.toFixed(2).replace(".", ",");

    let statoHtml = "";
    if (riga.saltato) {
      statoHtml = '<span class="badge-saltato">Saltato — non importato</span>';
    } else if (riga.socio_id) {
      const socioTrovato = elencoSociGlobale.find((s) => s.id === riga.socio_id);
      const nomeSocio = socioTrovato ? socioTrovato.nome : "id " + riga.socio_id;
      statoHtml = '<span class="badge-riconosciuto">✓ ' + nomeSocio + "</span>";
    } else {
      statoHtml = costruisciSelectAbbinamento(indice);
    }

    div.innerHTML = `
      <div class="nome-scritto">${riga.nome_scritto}</div>
      <div class="totale-scritto">€ ${totaleTesto}</div>
      <div class="stato-abbinamento" data-indice="${indice}">${statoHtml}</div>
    `;
    contenitore.appendChild(div);

    // Se ho appena disegnato una select, collego l'evento di cambio
    if (!riga.socio_id && !riga.saltato) {
      const select = div.querySelector("select");
      select.onchange = () => scegliAbbinamento(indice, select.value);
    }
  });

  aggiornaRiepilogoImport();
}

function costruisciSelectAbbinamento(indice) {
  let opzioni = '<option value="">— scegli socio o salta —</option>';
  opzioni += '<option value="salta">Salta (socio non ancora tesserato / da ignorare)</option>';
  elencoSociGlobale.forEach((s) => {
    opzioni += `<option value="${s.id}">${s.nome}</option>`;
  });
  return `<select>${opzioni}</select>`;
}

async function scegliAbbinamento(indice, valoreScelto) {
  if (!valoreScelto) return;

  if (valoreScelto === "salta") {
    elencoAbbinamento[indice].saltato = true;
    disegnaTabellaAbbinamento();
    return;
  }

  const socio_id = parseInt(valoreScelto, 10);
  elencoAbbinamento[indice].socio_id = socio_id;

  // Salvo subito il soprannome, così le prossime volte viene riconosciuto da solo
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  await fetch("/api/admin-salva-soprannome", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({
      soprannome: elencoAbbinamento[indice].nome_scritto,
      socio_id,
    }),
  });

  disegnaTabellaAbbinamento();
}

function aggiornaRiepilogoImport() {
  const riconosciuti = elencoAbbinamento.filter((r) => r.socio_id && !r.saltato).length;
  const daAbbinare = elencoAbbinamento.filter((r) => !r.socio_id && !r.saltato).length;
  const saltati = elencoAbbinamento.filter((r) => r.saltato).length;

  document.getElementById("riepilogoImport").innerHTML =
    `<strong>${riconosciuti}</strong> pronti per l'importazione, ` +
    `<strong>${daAbbinare}</strong> ancora da abbinare, ` +
    `<strong>${saltati}</strong> saltati.`;
}

async function confermaImportazione() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  const nome_ordine = document.getElementById("importaNomeOrdine").value.trim();
  const lettera = document.getElementById("importaLettera").value;
  const msg = document.getElementById("msgImporta");

  const daAbbinare = elencoAbbinamento.filter((r) => !r.socio_id && !r.saltato);
  if (daAbbinare.length > 0) {
    msg.textContent = "Ci sono ancora " + daAbbinare.length + " soci da abbinare o saltare prima di importare.";
    msg.className = "errore-msg";
    return;
  }

  const righeDaImportare = elencoAbbinamento
    .filter((r) => r.socio_id && !r.saltato)
    .map((r) => ({ socio_id: r.socio_id, totale: r.totale }));

  if (righeDaImportare.length === 0) {
    msg.textContent = "Nessuna riga da importare (tutte saltate).";
    msg.className = "errore-msg";
    return;
  }

  const confermato = confirm(
    `Confermi l'importazione di ${righeDaImportare.length} righe per l'ordine "${nome_ordine}" (progetto ${lettera})?\n\nQuesta azione scrive dati permanenti in Cassa.`
  );
  if (!confermato) return;

  msg.textContent = "Importazione in corso...";
  msg.className = "";

  const risposta = await fetch("/api/admin-importa-ordine", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    },
    body: JSON.stringify({ nome_ordine, lettera, righe: righeDaImportare }),
  });
  const dati = await risposta.json();

  if (!dati.ok) {
    msg.textContent = dati.errore || "Errore durante l'importazione.";
    msg.className = "errore-msg";
    return;
  }

  msg.textContent = "Importazione completata: " + dati.righe_importate + " righe scritte in Cassa.";
  msg.className = "ok";
  document.getElementById("areaAbbinamento").style.display = "none";
  document.getElementById("importaNomeOrdine").value = "";
  document.getElementById("importaLink1").value = "";
  document.getElementById("importaLink2").value = "";
  elencoAbbinamento = [];
}

(async function avvia() {
  const token = localStorage.getItem(ADMIN_TOKEN_KEY);
  if (token) {
    await mostraPannello();
    await caricaProgetti();
    await popolaMenuLettere();
  }
})();
</script>
