<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuttoInsieme - La mia cassa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #6a9c78;
    --crema: #fdf8f0;
    --terra: #b5651d;
    --testo: #3a3a3a;
    --bordo-tabella: #d9d2c3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef3ea, #fdf8f0);
    font-family: 'Nunito', sans-serif;
    color: var(--testo);
    padding: 20px;
  }
  .contenitore { max-width: 540px; margin: 0 auto; }
  @media (min-width: 640px) {
    .contenitore { max-width: 760px; }
  }
  .intestazione {
    background: var(--verde);
    color: white;
    border-radius: 24px;
    padding: 26px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .intestazione h1 {
    font-family: 'Baloo 2', sans-serif;
    margin: 0 0 4px;
    font-size: 1.5rem;
  }
  .intestazione .saldo {
    font-family: 'Baloo 2', sans-serif;
    font-size: 2.2rem;
    margin-top: 8px;
  }
  .scontrino {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    margin-top: 16px;
    padding: 10px 22px;
    max-height: 68vh;
    overflow-y: auto;
    font-size: 1.02rem;
  }
  .riga {
    border-bottom: 1px solid #eee;
    padding: 16px 0;
  }
  .riga:last-child { border-bottom: none; }
  .riga-alto {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .riga-data { color: #777; font-size: 0.9rem; }
  .riga-descrizione { font-weight: 700; margin-top: 4px; font-size: 1.05rem; }
  .riga-importo { font-family: 'Baloo 2', sans-serif; font-size: 1.15rem; white-space: nowrap; }
  .importo-piu { color: var(--verde); }
  .importo-meno { color: #c0392b; }
  .riga-saldo { color: #888; font-size: 0.85rem; text-align: right; margin-top: 4px; }
  .nota {
    font-size: 0.92rem;
    color: #555;
    margin-top: 8px;
    background: var(--crema);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .tabella-prodotti {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 0.92rem;
  }
  .tabella-prodotti th,
  .tabella-prodotti td {
    border: 1px solid var(--bordo-tabella);
    padding: 8px;
  }
  .tabella-prodotti th {
    background: var(--crema);
    font-weight: 700;
    text-align: left;
  }
  .tabella-prodotti th.numero,
  .tabella-prodotti td.numero {
    text-align: right;
    white-space: nowrap;
  }
  .tabella-prodotti tfoot td {
    background: var(--crema);
    font-weight: 700;
    cursor: pointer;
  }
  .freccia-tendina { display: inline-block; margin-right: 6px; }
  .badge-ritirato {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.88rem;
    color: var(--verde);
    font-weight: 700;
  }
  .vuoto { text-align: center; color: #999; padding: 30px 0; }
  .esci {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #999;
    text-decoration: underline;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #caricamento { text-align: center; color: #999; margin-top: 40px; }
</style>
</head>
<body>

<div class="contenitore">
  <div id="caricamento">Carico la tua cassa...</div>

  <div id="pagina" style="display:none;">
    <div class="intestazione">
      <h1 id="nomeSocio"></h1>
      <div class="saldo" id="saldoAttuale"></div>
    </div>

    <div class="scontrino" id="scontrino"></div>

    <a class="esci" onclick="esci()">Esci</a>
  </div>
</div>

<script>
const TOKEN_KEY = "ti_token";

function formattaEuro(n) {
  const numero = Number(n) || 0;
  const segno = numero < 0 ? "-" : "";
  return segno + "€" + Math.abs(numero).toFixed(2).replace(".", ",");
}

function formattaDataItaliana(iso) {
  if (!iso) return "";
  const [a, m, g] = iso.split("-");
  return g + "/" + m + "/" + a;
}

function esci() {
  localStorage.removeItem(TOKEN_KEY);
  window.location.href = "index.html";
}

function toggleTabella(id) {
  const tbody = document.getElementById("corpo-" + id);
  const freccia = document.getElementById("freccia-" + id);
  const aperta = tbody.style.display === "table-row-group";
  tbody.style.display = aperta ? "none" : "table-row-group";
  freccia.textContent = aperta ? "▾" : "▴";
}

function disegnaRighe(righe) {
  const contenitore = document.getElementById("scontrino");

  if (!righe.length) {
    contenitore.innerHTML = '<div class="vuoto">Nessun movimento registrato.</div>';
    return;
  }

  let html = "";
  righe.forEach(r => {
    const isVersamento = r.tipo === "versamento";
    const classeImporto = isVersamento ? "importo-piu" : "importo-meno";
    const segno = isVersamento ? "+" : "-";

    html += '<div class="riga">';
    html += '<div class="riga-alto">';
    html += '<div><div class="riga-data">' + formattaDataItaliana(r.data) + '</div>';
    html += '<div class="riga-descrizione">' + r.descrizione + '</div></div>';
    html += '<div class="riga-importo ' + classeImporto + '">' + segno + formattaEuro(r.importo_totale) + '</div>';
    html += '</div>';
    html += '<div class="riga-saldo">saldo: ' + formattaEuro(r.saldo_dopo) + '</div>';

    if (!isVersamento && r.lettera) {
      html += '<div class="nota">' + r.lettera;
      if (r.nome_progetto) html += ' · ' + r.nome_progetto;
      if (r.didascalia) html += ' — ' + r.didascalia;
      if (r.maggiorazione > 0) html += ' (+' + formattaEuro(r.maggiorazione) + ')';
      html += '</div>';
    }

    if (r.dettaglio_prodotti && r.dettaglio_prodotti.length) {
      let totaleListino = 0;
      let totaleOfferta = 0;
      let totaleRegalo = 0;
      let listinoDisponibile = true;

      r.dettaglio_prodotti.forEach(p => {
        const qta = Number(p.quantita) || 1;
        const listinoUnit = Number(p.prezzo_listino);
        const netto = Number(p.prezzo_netto) || 0;
        const scontato = Number(p.prezzo_scontato ?? p.prezzo_netto) || 0;

        if (!isNaN(listinoUnit) && listinoUnit > 0) {
          totaleListino += listinoUnit * qta;
        } else {
          listinoDisponibile = false;
        }
        totaleOfferta += netto;
        totaleRegalo += scontato;
      });

      html += '<table class="tabella-prodotti">';
      html += '<thead><tr>';
      html += '<th>Prodotto</th>';
      html += '<th class="numero">Listino</th>';
      html += '<th class="numero">Offerta fornitore</th>';
      html += '<th class="numero">Regalo referente</th>';
      html += '</tr></thead>';

      html += '<tbody id="corpo-' + r.id + '" style="display:none;">';
      r.dettaglio_prodotti.forEach(p => {
        const qta = Number(p.quantita) || 1;
        const listinoUnit = Number(p.prezzo_listino);
        const listinoTotale = (!isNaN(listinoUnit) && listinoUnit > 0) ? listinoUnit * qta : null;
        const netto = Number(p.prezzo_netto) || 0;
        const scontato = Number(p.prezzo_scontato ?? p.prezzo_netto) || 0;
        const nomeProdotto = (p.prodotto || "") + (p.formato ? " (" + p.formato + ")" : "") + (p.quantita ? " x" + p.quantita : "");

        html += '<tr>';
        html += '<td>' + nomeProdotto + '</td>';
        html += '<td class="numero">' + (listinoTotale !== null ? formattaEuro(listinoTotale) : "–") + '</td>';
        html += '<td class="numero">' + formattaEuro(netto) + '</td>';
        html += '<td class="numero">' + formattaEuro(scontato) + '</td>';
        html += '</tr>';
      });
      html += '</tbody>';

      html += '<tfoot><tr onclick="toggleTabella(' + r.id + ')">';
      html += '<td><span class="freccia-tendina" id="freccia-' + r.id + '">▾</span>' + r.dettaglio_prodotti.length + ' prodotti</td>';
      html += '<td class="numero">' + (listinoDisponibile ? formattaEuro(totaleListino) : "–") + '</td>';
      html += '<td class="numero">' + formattaEuro(totaleOfferta) + '</td>';
      html += '<td class="numero">' + formattaEuro(totaleRegalo) + '</td>';
      html += '</tr></tfoot>';

      html += '</table>';
    }

    if (!isVersamento && r.ritirato === 1) {
      html += '<div class="badge-ritirato">✓ Ritirato</div>';
    }

    html += '</div>';
  });

  contenitore.innerHTML = html;
  contenitore.scrollTop = contenitore.scrollHeight;
}

async function caricaCassa() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    window.location.href = "index.html";
    return;
  }

  const risposta = await fetch("/api/cassa-socio", {
    headers: { "Authorization": "Bearer " + token }
  });

  if (risposta.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    window.location.href = "index.html";
    return;
  }

  const dati = await risposta.json();

  document.getElementById("nomeSocio").textContent = dati.nome;
  document.getElementById("saldoAttuale").textContent = formattaEuro(dati.saldo_attuale);
  disegnaRighe(dati.righe);

  document.getElementById("caricamento").style.display = "none";
  document.getElementById("pagina").style.display = "block";
}

caricaCassa();
</script>

</body>
</html>
